name: Deploy demo

# Publishes examples/react-app to GitHub Pages. The demo runs entirely in the
# browser against the simulated printer, so there is nothing to host beyond
# static files and nothing to keep running.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example consumes the built package, exactly like a real install.
      - name: Build library
        run: pnpm build

      - name: Test demo
        run: pnpm --filter epos-printer-react-example test

      - name: Build demo
        run: pnpm --filter epos-printer-react-example build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
