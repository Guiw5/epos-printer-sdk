name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Hardware tests self-skip: PRINTER_ADDRESS is intentionally unset in CI.
      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Verify package contents
        run: npm pack --dry-run
