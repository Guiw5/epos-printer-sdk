<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>epos-printer-sdk demo</title>
  </head>
  <body>
    <div id="app">
      <h1>epos-printer-sdk</h1>
      <p class="subtitle">Minimal <code>EposHttpPrinter</code> example: no sockets, no callbacks.</p>

      <section class="card">
        <h2>1. Connection</h2>
        <form id="connect-form">
          <label>
            Address
            <input id="address" type="text" placeholder="192.168.1.100 or printer.example.com" required />
          </label>
          <label>
            Port
            <input id="port" type="number" value="443" required />
          </label>
          <div class="actions">
            <button id="connect-btn" type="submit">Connect</button>
            <button id="disconnect-btn" type="button" disabled>Disconnect</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>2. Printer</h2>
        <div class="actions">
          <button id="print-btn" type="button" disabled>Print a test receipt</button>
          <button id="status-btn" type="button" disabled>Check status</button>
        </div>
      </section>

      <section class="card">
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
